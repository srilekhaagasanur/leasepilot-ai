spring.application.name=backend

# Database (password comes from the DB_PASSWORD environment variable)
spring.datasource.url=jdbc:mysql://localhost:3306/leasepilot
spring.datasource.username=leasepilot
spring.datasource.password=${DB_PASSWORD}

# Let Hibernate create/update tables from our entity classes (fine for development)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Meta Model API (key comes from the META_API_KEY environment variable)
meta.api.base-url=https://api.meta.ai/v1
meta.api.key=${META_API_KEY}
meta.api.chat-model=muse-spark-1.3
meta.api.transcribe-model=muse-voice-transcribe-1.0

# Tenant uploads (photos, voice notes) are saved here, relative to the backend folder.
# This folder is in .gitignore so uploads never end up on GitHub.
app.upload-dir=uploads
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=40MB

# Include our error messages (e.g. "Photo must be JPEG or PNG") in error responses
spring.web.error.include-message=always
spring.web.error.include-stacktrace=never
