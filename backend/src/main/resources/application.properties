spring.application.name=backend

# Database (password comes from the DB_PASSWORD environment variable)
spring.datasource.url=jdbc:mysql://localhost:3306/leasepilot
spring.datasource.username=leasepilot
spring.datasource.password=${DB_PASSWORD}

# Let Hibernate create/update tables from our entity classes (fine for development)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Meta Model API (key comes from the META_API_KEY environment variable)
meta.api.base-url=https://api.meta.ai/v1
meta.api.key=${META_API_KEY}
meta.api.chat-model=muse-spark-1.3
meta.api.transcribe-model=muse-voice-transcribe-1.0
meta.api.sam-model=sam-3.1

# Tenant uploads (photos, voice notes) are saved here, relative to the backend folder.
# This folder is in .gitignore so uploads never end up on GitHub.
app.upload-dir=uploads
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=40MB

# Include our error messages (e.g. "Photo must be JPEG or PNG") in error responses
spring.web.error.include-message=always
spring.web.error.include-stacktrace=never
# Demo mode: "Try as..." buttons log into the seeded demo accounts without a password, and Reset demo is allowed
app.demo-enabled=true
# The login cookie isn't sent on requests coming from other websites
server.servlet.session.cookie.same-site=lax
# Email (optional). Without MAIL_HOST, emails are printed in the backend terminal instead of being sent.
# To send real email, set MAIL_HOST, MAIL_USERNAME, MAIL_PASSWORD (and MAIL_FROM) to your SMTP provider's values.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail-from=${MAIL_FROM:LeasePilot <no-reply@leasepilot.local>}
# Where the frontend runs; used to build links in emails (e.g. password reset)
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
